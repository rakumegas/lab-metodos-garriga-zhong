name: Autograde

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ejecutar autograde
        run: java autograde/Autograde.java
